server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 512;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache longo para assets versionáveis; ajuste se trocar imagens sem mudar o nome do arquivo
    location ~* \.(?:css|js|webp|png|jpe?g|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
